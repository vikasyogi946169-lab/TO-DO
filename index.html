<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f2ec;
            font-family: Georgia, "Times New Roman", serif;
        }

        .todo-container {
            width: 540px;
            max-width: 92%;
            padding: 35px;
            background: #f9e8dc;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            transition: 0.3s ease;
        }

        .todo-container:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.16);
        }

        h1 {
            text-align: center;
            color: #15559c;
            font-size: 28px;
            margin-bottom: 22px;
        }

        .input-area {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .input-area input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 2px solid #2a68a7;
            border-radius: 7px;
            outline: none;
            background: transparent;
            font-size: 15px;
        }

        .input-area input:focus {
            border-color: #15559c;
            box-shadow: 0 0 5px rgba(21, 85, 156, 0.3);
        }

        .add-btn {
            padding: 13px 16px;
            background: #1670ce;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn:hover {
            background: #1058a5;
            transform: translateY(-2px);
        }

        .task-list {
            list-style: none;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 15px 0;
            border-bottom: 1px dotted #c9b9ae;
        }

        .task-label {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
            font-size: 20px;
        }

        .task-label input {
            width: 20px;
            height: 20px;
            accent-color: green;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* CSS-only completed task effect */
        .task-label input:checked + span {
            text-decoration: line-through;
            color: #888;
        }

        .remove-btn {
            padding: 11px 14px;
            background: #d43b37;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .remove-btn:hover {
            background: #a92320;
            transform: scale(1.04);
        }

        @media (max-width: 480px) {
            .todo-container {
                padding: 24px 18px;
            }

            h1 {
                font-size: 25px;
            }

            .input-area {
                gap: 8px;
            }

            .input-area input {
                padding: 11px 8px;
                font-size: 13px;
            }

            .add-btn {
                padding: 11px;
                font-size: 13px;
            }

            .task-label {
                font-size: 16px;
                gap: 8px;
            }

            .remove-btn {
                padding: 9px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="todo-container">

        <h1>To-Do-List</h1>

        <div class="input-area">
            <input
                type="text"
                placeholder="What needs to be done?"
                id="data-input"
            >

            <button class="add-btn" type="button" onclick="Addtask()">
                Add Task
            </button>
        </div>

        <ul class="task-list" id="msd">

           
        </ul>

    </div>
  <script>
       let dataarray = JSON.parse(localStorage.getItem("task"))  || []
       let addition = document.getElementById("msd")
    function Addtask(){
        let dat = document.getElementById("data-input").value;
        if(dat.length > 0){
   console.log(dat)
        dataarray.push(dat)
        console.log(dataarray)
        Showdata()
    document.getElementById("data-input").value = ""
    localStorage.setItem("task", JSON.stringify(dataarray) )
        }else{
            alert("please feed data")
        }
      

    }
    
    function Showdata(){
     addition.innerHTML = "";
       dataarray.map((item, index) => {
            return addition.innerHTML += `
                  <li class="task">
                <label class="task-label">
                    <input type="checkbox" checked>
                    <span>${item}</span>
                </label>

                <button class="remove-btn" type="button" onclick="Removetask(${index})">
                    Remove
                </button>
            </li>
            `
        })
    }

    Showdata()

    function Removetask(a){
let sdf = confirm("you confirm to remove")
if(sdf == true){
dataarray.splice(a,1);
Showdata()
localStorage.setItem("task", JSON.stringify(dataarray) )
}

    }
  </script>

</body>
</html>
